name: Build & Release Package

# • Every push / pull request: validate the extension and build the zip
#   (downloadable from the run's "Artifacts" section).
# • Push a tag like v2.1.0, or run this workflow manually with "publish" ticked:
#   create a GitHub Release with the zip + checksums attached.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release for the version in manifest.json'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version from manifest.json
        id: meta
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag must match manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${{ steps.meta.outputs.version }}"
            exit 1
          fi

      - name: Validate & build package
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: minthrm-attendance-automation-v${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: minthrm-attendance-automation-v${{ needs.build.outputs.version }}
          path: dist

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.build.outputs.version }}" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found' CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<'MD'

          ---
          ### Install
          1. Download **minthrm-attendance-automation.zip** below and unzip it.
          2. Open `chrome://extensions` (Edge: `edge://extensions`) and turn on **Developer mode**.
          3. Click **Load unpacked** and select the `minthrm-attendance-automation` folder.

          Verify the download against `SHA256SUMS.txt` if you like.
          MD

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
